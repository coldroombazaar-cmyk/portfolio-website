<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | UX Designer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>



  <section id="admin-login-section"
    style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="contact-form-panel" style="width: 100%; max-width: 400px; padding: 40px;">
      <h2 style="text-align: center; margin-bottom: 24px;">Admin Login</h2>
      <form id="admin-login-form">
        <div class="contact-form__field">
          <input type="text" id="login-id" placeholder=" " required />
          <label for="login-id">Admin ID</label>
        </div>
        <div class="contact-form__field">
          <input type="password" id="login-password" placeholder=" " required />
          <label for="login-password">Password</label>
        </div>
        <p id="login-error"
          style="color: var(--danger); font-size: 14px; margin-bottom: 16px; text-align: center; display: none;">Invalid
          Admin ID or Password</p>
        <button type="submit" class="contact-form__submit" style="width: 100%;">Access Dashboard</button>
      </form>
    </div>
  </section>

  <div class="admin-dashboard" id="admin-main-content" style="display: none;">
    <aside class="admin-sidebar">
      <h2 class="admin-sidebar__title">Admin Panel</h2>
      <nav class="admin-sidebar__nav">
        <a href="admin.html" class="admin-sidebar__link active">Messages</a>
        <a href="admin-home.html" class="admin-sidebar__link">Home Page</a>
        <a href="admin-about.html" class="admin-sidebar__link">About Section</a>
        <a href="admin-projects.html" class="admin-sidebar__link">Project Cards</a>
        <a href="admin-contact.html" class="admin-sidebar__link">Contact Page</a>
        <a href="admin-navbar.html" class="admin-sidebar__link">Navbar</a>
        <a href="admin-footer.html" class="admin-sidebar__link">Footer</a>
        <a href="admin-splash.html" class="admin-sidebar__link">Splash Screen</a>
      </nav>
      <button id="admin-logout-btn" class="admin-sidebar__logout">Logout</button>
    </aside>

    <main class="admin-content-area">
      <header class="admin-header">
        <h1>Inbox</h1>
        <p>All contact-form messages, newest first.</p>
      </header>

      <div class="admin-toolbar">
        <div id="message-counter">📬 0 messages</div>
        <label class="admin-toggle">
          <input type="checkbox" id="unread-only-toggle">
          <span class="admin-toggle-label">Unread only</span>
        </label>
      </div>

      <div class="admin-content">
        <div id="admin-inbox-grid" class="admin-grid">
          <!-- Cards will be injected here by JS -->
        </div>
      </div>
    </main>
  </div>



  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
</body>

</html>
