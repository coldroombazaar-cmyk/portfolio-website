<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Navbar CMS | UX Designer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if (localStorage.getItem("adminLoggedIn") !== "true") {
      window.location.href = "admin.html";
    }
  </script>
</head>

<body>

  <div class="admin-dashboard" id="admin-main-content">
    <aside class="admin-sidebar">
      <h2 class="admin-sidebar__title">Admin Panel</h2>
      <nav class="admin-sidebar__nav">
        <a href="admin.html" class="admin-sidebar__link">Messages</a>
        <a href="admin-home.html" class="admin-sidebar__link">Home Page</a>
        <a href="admin-about.html" class="admin-sidebar__link">About Section</a>
        <a href="admin-projects.html" class="admin-sidebar__link">Project Cards</a>
        <a href="admin-contact.html" class="admin-sidebar__link">Contact Page</a>
        <a href="admin-navbar.html" class="admin-sidebar__link active">Navbar</a>
        <a href="admin-footer.html" class="admin-sidebar__link">Footer</a>
        <a href="admin-splash.html" class="admin-sidebar__link">Splash Screen</a>
      </nav>
      <button id="admin-logout-btn" class="admin-sidebar__logout">Logout</button>
    </aside>

    <main class="admin-content-area">
      <header class="admin-header">
        <div>
          <h1>Navbar CMS</h1>
          <p>Customize your public website navigation, brand logo, and active links</p>
        </div>
      </header>

      <div id="navbar-cms-status" style="display: none; padding: 12px; border-radius: 4px; margin-bottom: 24px; font-weight: 500;"></div>

      <!-- Section 1: Brand Settings -->
      <div class="admin-card about-cms-card" style="margin-bottom: 24px;">
        <h3 class="about-cms-card__title">Brand Settings</h3>
        <form id="brand-settings-form">
          <div style="display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap;">
            <div class="admin-form-group" style="flex: 2; min-width: 250px; margin-bottom: 0;">
              <label for="navbar-brand-text">Brand Title Text *</label>
              <input type="text" id="navbar-brand-text" required placeholder="e.g. Atanu Mondal">
            </div>
            
            <div class="admin-form-group" style="flex: 2; min-width: 250px; margin-bottom: 0;">
              <label for="navbar-brand-link">Brand Redirect Link *</label>
              <input type="text" id="navbar-brand-link" required placeholder="e.g. index.html">
            </div>

            <div class="admin-form-group" style="flex: 1; min-width: 150px; margin-bottom: 0; align-self: center; margin-top: 24px;">
              <label class="admin-toggle">
                <input type="checkbox" id="navbar-show-toggle" checked>
                <span class="admin-toggle-label">Show Theme Toggle</span>
              </label>
            </div>
          </div>
          
          <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
            <button type="submit" id="btn-save-brand" class="admin-btn admin-btn--primary">Save Brand Settings</button>
          </div>
        </form>
      </div>

      <!-- Section 2: Navbar Menu Items -->
      <div class="admin-card about-cms-card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 24px;">
          <h3 class="about-cms-card__title" style="margin: 0; border: none; padding: 0;">Menu Links</h3>
          <button type="button" id="btn-add-menu-item" class="admin-btn admin-btn--primary" style="padding: 6px 12px; font-size: 14px;">+ Add New Menu Item</button>
        </div>

        <div class="admin-table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Label</th>
                <th>URL Link</th>
                <th style="width: 100px; text-align: center;">Display Order</th>
                <th style="width: 120px; text-align: center;">Status</th>
                <th style="width: 160px; text-align: center;">Actions</th>
              </tr>
            </thead>
            <tbody id="menu-items-table-body">
              <tr>
                <td colspan="5" style="text-align: center;">Loading menu links...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Menu Item Add/Edit Modal -->
  <div class="admin-modal" id="menu-item-modal">
    <div class="admin-modal__content">
      <div class="admin-modal__header">
        <h2 id="menu-item-modal-title">Add Menu Item</h2>
        <button type="button" class="admin-modal__close" id="menu-item-modal-close">&times;</button>
      </div>
      <form id="menu-item-form">
        <input type="hidden" id="menu-item-id">
        
        <div class="admin-form-group">
          <label for="menu-item-label">Label *</label>
          <input type="text" id="menu-item-label" required placeholder="e.g. Services">
        </div>
        
        <div class="admin-form-group">
          <label for="menu-item-url">URL Link *</label>
          <input type="text" id="menu-item-url" required placeholder="e.g. services.html">
        </div>
        
        <div style="display: flex; gap: 16px;">
          <div class="admin-form-group" style="flex: 1;">
            <label for="menu-item-status">Status</label>
            <select id="menu-item-status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
          <div class="admin-form-group" style="flex: 1;">
            <label for="menu-item-display-order">Display Order</label>
            <input type="number" id="menu-item-display-order" value="0" min="0">
          </div>
        </div>
        
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <button type="button" class="admin-btn admin-btn--outline" id="menu-item-modal-cancel">Cancel</button>
          <button type="submit" class="admin-btn admin-btn--primary">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="navbar-cms.js"></script>
</body>

</html>
